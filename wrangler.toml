name = "recipe-app"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# D1データベース (wrangler d1 create recipe-app-db で作成後、database_id を書き換える)
[[d1_databases]]
binding = "DB"
database_name = "recipe-app-db"
database_id = "4ece8d15-f763-4080-b369-abfd4d11b329"

# WebAuthnのRP(Relying Party)設定。本番ドメインに合わせて変更する
[vars]
RP_ID = "recipe-app-8v0.pages.dev"
RP_NAME = "今日のレシピ回し"
ORIGIN = "https://recipe-app-8v0.pages.dev"
